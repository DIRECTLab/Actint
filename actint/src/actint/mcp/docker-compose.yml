version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=mcp
    container_name: ais-mcp-server
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - LOG_LEVEL=INFO
    volumes:
      - /tmp/ais_queries.jsonl:/tmp/ais_queries.jsonl
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db
    command: python -m actint.mcp.mcp_server

  llm-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=llm
    container_name: ais-llm-server
    ports:
      - "8000:8000"
    environment:
      - LLM_SERVER_HOST=0.0.0.0
      - LLM_SERVER_PORT=8000
      - MCP_SERVER_URL=http://mcp-server:8001
      - LLM_MODEL=Qwen/Qwen3.5-9B
      - LLM_DEVICE=auto
      - LOG_LEVEL=INFO
    volumes:
      - /tmp/ais_queries.jsonl:/tmp/ais_queries.jsonl
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - mcp-server
    command: uvicorn actint.mcp.llm_server:app --host 0.0.0.0 --port 8000

  # Optional: Database service (adjust connection string as needed)
  db:
    image: sqlite
    container_name: ais-database
    volumes:
      - ais-db:/data
    networks:
      - ais-network

networks:
  ais-network:
    driver: bridge

volumes:
  ais-db:
    driver: local
